syntax = "proto3";

package usersrv.v1;

import "google/protobuf/timestamp.proto";
import "platform/v1/options.proto";
import "usersrv/v1/account.proto";

option go_package = "github.com/kongken/mono/pkg/proto/usersrv/v1;usersrvv1";

// Internal usersrv contracts for ADR 0001; no browser exposure. Anonymous
// methods still require a trusted BFF service credential bound to the method.
enum ExternalProvider {
  EXTERNAL_PROVIDER_UNSPECIFIED = 0;
  EXTERNAL_PROVIDER_GOOGLE = 1;
  EXTERNAL_PROVIDER_GITHUB = 2;
}

// ExternalIdentityKey is internal-only provider identity data, populated only
// after server-side adapter verification. A browser-supplied key, email or user
// ID is never proof and must never select a login/binding target in an RPC.
// This type must not appear in browser responses, audit or logs.
message ExternalIdentityKey {
  ExternalProvider provider = 1;
  // Fixed canonical issuer: https://accounts.google.com or https://github.com.
  string issuer = 2;
  // Google sub or GitHub numeric ID as canonical decimal text, never username/email.
  string subject = 3;
}

// ExternalIdentitySummary is the owner's safe view, with no external subject,
// provider email, tokens or claims. Binding RPCs arrive in later stages.
message ExternalIdentitySummary {
  string external_identity_id = 1;
  ExternalProvider provider = 2;
  string display_label = 3;
  google.protobuf.Timestamp linked_at = 4;
  google.protobuf.Timestamp last_authenticated_at = 5;
}

// External auth errors use google.rpc.ErrorInfo, domain usersrv.v1, with the
// following fixed reason/code pairs. No detail contains subject/email/claims:
// PROVIDER_DISABLED          FAILED_PRECONDITION (external global/provider off)
// PROVIDER_REJECTED          UNAUTHENTICATED (neutral cancel/proof/email failure)
// IDENTITY_CONFLICT          ALREADY_EXISTS (never identifies the other owner)
// IDENTITY_LIMIT_REACHED     FAILED_PRECONDITION (one identity per provider)
// REGISTRATION_UNAVAILABLE   FAILED_PRECONDITION (new-account branch only)
// LAST_CREDENTIAL            FAILED_PRECONDITION
// MUTATION_REPLAY_MISMATCH    ABORTED
// CHALLENGE_INVALID          FAILED_PRECONDITION
// VERSION_CONFLICT           ABORTED (existing reason)
// STATE_INVALID belongs to BFF browser state validation, not a usersrv proof.
// Existing email registration keeps REGISTRATION_CLOSED; no fields are renumbered.

service ExternalIdentityService {
  rpc BeginExternalLogin(BeginExternalLoginRequest) returns (BeginExternalLoginResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc CompleteExternalLogin(CompleteExternalLoginRequest) returns (CompleteExternalLoginResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc RequestExternalRegistrationEmail(RequestExternalRegistrationEmailRequest) returns (RequestExternalRegistrationEmailResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc ConfirmExternalRegistrationEmail(ConfirmExternalRegistrationEmailRequest) returns (ConfirmExternalRegistrationEmailResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc GetExternalRegistration(GetExternalRegistrationRequest) returns (GetExternalRegistrationResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc CompleteExternalRegistration(CompleteExternalRegistrationRequest) returns (CompleteExternalRegistrationResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc BeginIdentityOperation(BeginIdentityOperationRequest) returns (BeginIdentityOperationResponse);
  rpc ConfirmIdentityOperation(ConfirmIdentityOperationRequest) returns (ConfirmIdentityOperationResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc GetIdentityOperation(GetIdentityOperationRequest) returns (GetIdentityOperationResponse);
  rpc LinkExternalIdentity(LinkExternalIdentityRequest) returns (LinkExternalIdentityResponse);
  rpc UnlinkExternalIdentity(UnlinkExternalIdentityRequest) returns (UnlinkExternalIdentityResponse);
  rpc GetExternalIdentities(GetExternalIdentitiesRequest) returns (GetExternalIdentitiesResponse);
  rpc BeginConfirmedDeletion(BeginConfirmedDeletionRequest) returns (BeginConfirmedDeletionResponse);
}

// These are BFF-owned bindings conveyed over authenticated internal RPCs, not
// browser-supplied proof. User identity comes exclusively from credential sub.
message ExternalFlowBinding {
  string flow_id = 1;
  bytes context_hash = 2;
  bytes session_binding_hash = 3;
  int64 expected_auth_version = 4;
}
message ExternalChallengeReference {
  string challenge_id = 1;
  ExternalFlowBinding binding = 2;
}
message BeginExternalLoginRequest {
  ExternalProvider provider = 1;
  ExternalFlowBinding binding = 2;
  string redirect_uri = 3;
  string state = 4;
  string nonce = 5;
  string code_challenge = 6;
  string app_id = 7;
  string return_path = 8;
  // login uses an anonymous BFF credential, even during account switching;
  // link requires signed sub and the initiating session/version binding.
  string intent = 9;
}
message BeginExternalLoginResponse {
  string challenge_id = 1;
  string authorization_url = 2;
  int64 provider_config_version = 3;
}
message CompleteExternalLoginRequest {
  ExternalChallengeReference challenge = 1;
  ExternalProvider provider = 2;
  int64 provider_config_version = 3;
  string code = 4;
  string verifier = 5;
  string nonce = 6;
  string code_challenge = 7;
}
message ExternalAuthenticatedAccount {
  string user_id = 1;
  BaseProfile profile = 2;
  repeated string roles = 3;
  int64 auth_version = 4;
  bool has_password = 5;
}
message ExternalPending {
  string challenge_id = 1;
  string intent = 2;
  string candidate_email = 3;
  string display_name = 4;
  string avatar_url = 5;
  bool email_confirmed = 6;
}
message CompleteExternalLoginResponse {
  oneof result {
    ExternalAuthenticatedAccount authenticated = 1;
    ExternalPending pending = 2;
  }
}
message RequestExternalRegistrationEmailRequest {
  ExternalChallengeReference challenge = 1;
  string email = 2;
}
message RequestExternalRegistrationEmailResponse {}
message ConfirmExternalRegistrationEmailRequest {
  string challenge_id = 1;
  string token = 2;
}
message ConfirmExternalRegistrationEmailResponse {}
message GetExternalRegistrationRequest { ExternalChallengeReference challenge = 1; }
message GetExternalRegistrationResponse { ExternalPending pending = 1; }
message CompleteExternalRegistrationRequest {
  ExternalChallengeReference challenge = 1;
  string mutation_id = 2;
  string display_name = 3;
  string avatar_url = 4;
}
// A bound operation result, not a login credential; replay cannot issue sessions.
message CompleteExternalRegistrationResponse { string created_user_id = 1; }

enum IdentityOperationKind {
  IDENTITY_OPERATION_KIND_UNSPECIFIED = 0;
  IDENTITY_OPERATION_KIND_LINK = 1;
  IDENTITY_OPERATION_KIND_UNLINK = 2;
  IDENTITY_OPERATION_KIND_ACCOUNT_DELETION = 3;
}
message BeginIdentityOperationRequest {
  ExternalFlowBinding binding = 1;
  IdentityOperationKind kind = 2;
  string external_identity_id = 3;
  ExternalProvider provider = 4;
  string current_password = 5;
}
message BeginIdentityOperationResponse { string challenge_id = 1; }
message ConfirmIdentityOperationRequest {
  string challenge_id = 1;
  string token = 2;
}
message ConfirmIdentityOperationResponse {}
message GetIdentityOperationRequest { ExternalChallengeReference challenge = 1; }
message GetIdentityOperationResponse {
  string challenge_id = 1;
  string kind = 2;
  string status = 3;
  bool confirmed = 4;
}
message LinkExternalIdentityRequest {
  ExternalChallengeReference operation = 1;
  ExternalChallengeReference provider_proof = 2;
  string mutation_id = 3;
}
message LinkExternalIdentityResponse {
  string external_identity_id = 1;
  int64 auth_version = 2;
  bool replayed = 3;
  string result = 4;
}
message UnlinkExternalIdentityRequest {
  ExternalChallengeReference operation = 1;
  string external_identity_id = 2;
  string mutation_id = 3;
}
message UnlinkExternalIdentityResponse {
  int64 auth_version = 1;
  bool replayed = 2;
}
message GetExternalIdentitiesRequest {}
message GetExternalIdentitiesResponse { repeated ExternalIdentitySummary identities = 1; }
message BeginConfirmedDeletionRequest {
  ExternalChallengeReference operation = 1;
  string mutation_id = 2;
  string confirmation = 3;
}
message BeginConfirmedDeletionResponse { int64 auth_version = 1; }
