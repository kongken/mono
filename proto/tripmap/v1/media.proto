syntax = "proto3";
package tripmap.v1;
import "google/protobuf/timestamp.proto";
option go_package = "github.com/kongken/mono/pkg/proto/tripmap/v1;tripmapv1";

// City media. Reads require authorization; optional CDN URLs are public.
service MediaService {
  rpc PrepareUpload(PrepareUploadRequest) returns (PrepareUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc ListMedia(ListMediaRequest) returns (ListMediaResponse);
  rpc ReadMedia(ReadMediaRequest) returns (ReadMediaResponse);
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);
}
message MediaInfo {
  // Deprecated internal database identifier. Use media_ref for new clients.
  string id = 1;
  string region_code = 2;
  string filename = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  int32 width = 6;
  int32 height = 7;
  string status = 8;
  google.protobuf.Timestamp created_at = 9;
  string trip_id = 10;
  string media_ref = 11;
  string entry_ref = 12;
  int64 revision = 13;
}
message PrepareUploadRequest {
  string region_code = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  // Stable request ID. Exact replays return the same reservation.
  string upload_id = 5;
  // Optional. The trip must exist for this user in region_code.
  string trip_id = 6;
  // Required opaque public_ref of the owning Timeline Entry.
  string entry_ref = 7;
}
message PrepareUploadResponse {
  MediaInfo media = 1;
  string upload_url = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}
message CompleteUploadRequest { string id = 1; }
message CompleteUploadResponse { MediaInfo media = 1; }
message ListMediaRequest {
  // Empty returns all media, including retained media for unmarked cities.
  string region_code = 1;
  // Optional: only files attached to this trip.
  string trip_id = 2;
}
message ListMediaResponse { repeated MediaInfo media = 1; }
message ReadMediaRequest {
  string id = 1;
  bool thumbnail = 2;
}
message ReadMediaResponse {
  bytes data = 1;
  string content_type = 2;
  string filename = 3;
  // Public CDN URL when configured; data is empty. Otherwise data contains the file.
  string url = 4;
}
message DeleteMediaRequest { string id = 1; string mutation_id = 2; string media_ref = 3; optional int64 expected_revision = 4; }
message DeleteMediaResponse { MediaMutationReceipt receipt = 1; }
message MediaMutationReceipt {
  string mutation_id = 1;
  string media_id = 2;
  string result_state = 3;
  bool replayed = 4;
  google.protobuf.Timestamp recorded_at = 5;
  string media_ref = 6;
  string entry_ref = 7;
  int64 result_revision = 8;
  bytes result_snapshot = 9;
  int32 snapshot_version = 10;
}
