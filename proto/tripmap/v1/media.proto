syntax = "proto3";
package tripmap.v1;
import "google/protobuf/timestamp.proto";
option go_package = "go.orx.me/apps/trip-map/pkg/proto/tripmap/v1;tripmapv1";

// Private city media. Originals never have public download URLs.
service MediaService {
  rpc PrepareUpload(PrepareUploadRequest) returns (PrepareUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc ListMedia(ListMediaRequest) returns (ListMediaResponse);
  rpc ReadMedia(ReadMediaRequest) returns (ReadMediaResponse);
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);
}
message MediaInfo {
  string id = 1;
  string region_code = 2;
  string filename = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  int32 width = 6;
  int32 height = 7;
  string status = 8;
  google.protobuf.Timestamp created_at = 9;
  // Optional trip this file belongs to; empty for city-level files. A soft
  // reference: deleting the trip keeps the file, which stays listed for the city.
  string trip_id = 10;
}
message PrepareUploadRequest {
  string region_code = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  // Stable request ID. Exact replays return the same reservation.
  string upload_id = 5;
  // Optional. The trip must exist for this user in region_code.
  string trip_id = 6;
}
message PrepareUploadResponse {
  MediaInfo media = 1;
  string upload_url = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}
message CompleteUploadRequest { string id = 1; }
message CompleteUploadResponse { MediaInfo media = 1; }
message ListMediaRequest {
  // Empty returns all media, including retained media for unmarked cities.
  string region_code = 1;
  // Optional: only files attached to this trip.
  string trip_id = 2;
}
message ListMediaResponse { repeated MediaInfo media = 1; }
message ReadMediaRequest {
  string id = 1;
  bool thumbnail = 2;
}
message ReadMediaResponse {
  bytes data = 1;
  string content_type = 2;
  string filename = 3;
}
message DeleteMediaRequest { string id = 1; }
message DeleteMediaResponse {}
