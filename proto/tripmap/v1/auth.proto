syntax = "proto3";

package tripmap.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kongken/mono/pkg/proto/tripmap/v1;tripmapv1";

// AuthService handles accounts and bearer sessions. Register, Login and the
// OAuth methods are public; every other method requires
// "Authorization: Bearer <token>".
service AuthService {
  // Register creates a password account and signs it in.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login exchanges username and password for a session token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Logout revokes the session that made the request.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // DeleteAccount permanently removes the caller and owned data.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Me returns the signed-in user.
  rpc Me(MeRequest) returns (MeResponse);
  // ListSessions lists the caller's active sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession revokes one of the caller's own sessions.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // ListOAuthProviders returns the configured OAuth providers so clients know
  // which sign-in buttons to show.
  rpc ListOAuthProviders(ListOAuthProvidersRequest) returns (ListOAuthProvidersResponse);
  // BeginOAuthFlow returns the provider authorize URL and a single-use state.
  // Clients must remember the state and compare it on the callback.
  rpc BeginOAuthFlow(BeginOAuthFlowRequest) returns (BeginOAuthFlowResponse);
  // CompleteOAuthFlow exchanges the provider code for a session token.
  rpc CompleteOAuthFlow(CompleteOAuthFlowRequest) returns (CompleteOAuthFlowResponse);
}

message User {
  string id = 1;
  // Empty for accounts created through OAuth.
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  google.protobuf.Timestamp created_at = 5;
  bool deletion_pending = 6;
}

message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp last_used_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // True for the session that made this request.
  bool current = 5;
}

message RegisterRequest {
  // 3-32 characters from a-z, 0-9 and underscore; case-insensitive.
  string username = 1;
  // 8-72 bytes.
  string password = 2;
  string display_name = 3;
}

message RegisterResponse {
  string token = 1;
  User user = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string id = 1;
}

message RevokeSessionResponse {}

message OAuthProvider {
  string name = 1;
  string display_name = 2;
}

message ListOAuthProvidersRequest {}

message ListOAuthProvidersResponse {
  repeated OAuthProvider providers = 1;
}

message BeginOAuthFlowRequest {
  string provider = 1;
}

message BeginOAuthFlowResponse {
  string authorize_url = 1;
  string state = 2;
}

message CompleteOAuthFlowRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
}

message CompleteOAuthFlowResponse {
  string token = 1;
  User user = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message DeleteAccountRequest {
  // Must be the literal DELETE. Password accounts must re-enter their password.
  string confirmation = 1;
  string password = 2;
}
message DeleteAccountResponse {}
