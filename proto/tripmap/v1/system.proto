syntax = "proto3";

package tripmap.v1;

import "platform/v1/options.proto";

option go_package = "github.com/kongken/mono/pkg/proto/tripmap/v1;tripmapv1";

// SystemService exposes read-only infrastructure readiness, not user data. It is
// served over gRPC to the BFF only.
service SystemService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (platform.v1.anonymous) = true;
  }
}

message GetStatusRequest {}

message GetStatusResponse {
  bool ready = 1;
  repeated DependencyStatus dependencies = 2;
  // Highest footprint schema this server understands (2 = multiple trips per
  // city). Zero means an older server; clients must not send trip data to it.
  int32 footprint_schema = 3;
  // True when the server has public sharing configured (share.public_base_url).
  bool share_enabled = 4;
  // Digest of the exact bundled index and its reviewed migration rules (F10).
  string region_version = 5;
}

message DependencyStatus {
  string name = 1;
  bool ready = 2;
}
