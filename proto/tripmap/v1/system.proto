syntax = "proto3";

package tripmap.v1;

option go_package = "go.orx.me/apps/trip-map/pkg/proto/tripmap/v1;tripmapv1";

// SystemService exposes read-only infrastructure readiness, not user data.
service SystemService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  bool ready = 1;
  repeated DependencyStatus dependencies = 2;
  // Highest footprint schema this server understands (2 = multiple trips per
  // city). Zero means an older server; clients must not send trip data to it.
  int32 footprint_schema = 3;
  // True when the server has public sharing configured (share.public_base_url).
  bool share_enabled = 4;
  // Digest of the exact bundled index and its reviewed migration rules (F10).
  string region_version = 5;
}

message DependencyStatus {
  string name = 1;
  bool ready = 2;
}
