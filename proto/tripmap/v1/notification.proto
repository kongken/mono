syntax = "proto3";

package tripmap.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kongken/mono/pkg/proto/tripmap/v1;tripmapv1";

// NotificationService manages reminder preferences, the email address and the
// browser push subscriptions used by F12 memory reminders. Every method needs a
// bearer session and only touches the caller's own settings. Reminders are opt-in
// per kind and per channel; nothing is sent until the user switches it on.
service NotificationService {
  // GetNotificationSettings returns the caller's preferences and which channels the
  // server can use.
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);

  // UpdateNotificationSettings replaces the time zone, send hour, place-name
  // option and the listed kind/channel switches. Switches not listed keep their
  // value. Enabling the email channel needs a verified address and a configured
  // server; enabling push needs a configured server.
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse);

  // RequestEmailVerification sends a six-digit code to an address that is not
  // used until ConfirmEmail succeeds.
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);

  // ConfirmEmail checks the code and activates the address.
  rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);

  // RemoveEmail forgets the address and switches the email channel off.
  rpc RemoveEmail(RemoveEmailRequest) returns (RemoveEmailResponse);

  // RegisterPushSubscription stores this browser's Web Push subscription. A
  // browser registered by another account moves to the caller.
  rpc RegisterPushSubscription(RegisterPushSubscriptionRequest) returns (RegisterPushSubscriptionResponse);

  // RemovePushSubscription forgets one browser subscription of the caller.
  rpc RemovePushSubscription(RemovePushSubscriptionRequest) returns (RemovePushSubscriptionResponse);

  // SendTestNotification sends a fixed, generic message on one channel so the
  // user can check that it arrives. It never contains footprint data.
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);
}

message NotificationPreference {
  // "memory" ("N years ago today") or "annual_report" (last year's recap, first
  // week of January). Strings keep the contract open to new kinds.
  string kind = 1;
  // "email" or "push".
  string channel = 2;
  bool enabled = 3;
}

message NotificationSettings {
  // One entry for every kind and channel, enabled or not.
  repeated NotificationPreference preferences = 1;
  // IANA name deciding which local day a reminder belongs to.
  string timezone = 2;
  // Local hour 0-23 from which that day's reminders may be sent.
  int32 send_hour = 3;
  // Whether notifications may name places. Off by default.
  bool show_places = 4;
  // Verified address with the middle hidden, for example "a***@example.com".
  string email_masked = 5;
  bool email_verified = 6;
  // Address waiting for its code, masked.
  string pending_email_masked = 7;
  google.protobuf.Timestamp pending_expires_at = 8;
  // Browsers that can receive push for this account.
  int32 push_subscription_count = 9;
}

message GetNotificationSettingsRequest {}

message GetNotificationSettingsResponse {
  NotificationSettings settings = 1;
  // The server has SMTP, a public address and an unsubscribe secret configured.
  bool email_available = 2;
  // The server has a VAPID key pair configured.
  bool push_available = 3;
  // Application server key a browser needs to subscribe; empty without push.
  string vapid_public_key = 4;
}

message UpdateNotificationSettingsRequest {
  repeated NotificationPreference preferences = 1;
  string timezone = 2;
  int32 send_hour = 3;
  bool show_places = 4;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message RequestEmailVerificationRequest {
  string email = 1;
}

message RequestEmailVerificationResponse {
  string pending_email_masked = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ConfirmEmailRequest {
  string code = 1;
}

message ConfirmEmailResponse {
  NotificationSettings settings = 1;
}

message RemoveEmailRequest {}

message RemoveEmailResponse {
  NotificationSettings settings = 1;
}

message RegisterPushSubscriptionRequest {
  string endpoint = 1;
  // Base64url keys exactly as PushSubscription.toJSON() returns them.
  string p256dh = 2;
  string auth = 3;
}

message RegisterPushSubscriptionResponse {
  int32 push_subscription_count = 1;
}

message RemovePushSubscriptionRequest {
  string endpoint = 1;
}

message RemovePushSubscriptionResponse {
  int32 push_subscription_count = 1;
}

message SendTestNotificationRequest {
  // "email" or "push".
  string channel = 1;
}

message SendTestNotificationResponse {
  // Number of destinations the message was handed to (browsers or one address).
  int32 delivered = 1;
}
