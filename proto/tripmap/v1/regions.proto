syntax = "proto3";
package tripmap.v1;
option go_package = "go.orx.me/apps/trip-map/pkg/proto/tripmap/v1;tripmapv1";

// RegionService exposes the bundled catalog and migrates only the caller's data.
// Every method requires authentication; map boundaries remain static assets.
service RegionService {
  rpc GetRegionIndex(GetRegionIndexRequest) returns (GetRegionIndexResponse);
  rpc PreviewRegionUpgrade(PreviewRegionUpgradeRequest) returns (PreviewRegionUpgradeResponse);
  rpc ApplyRegionUpgrade(ApplyRegionUpgradeRequest) returns (ApplyRegionUpgradeResponse);
}
message RegionMapping {
  string from_code = 1;
  string from_name = 2;
  string from_province = 3;
  string to_code = 4;
}
message GetRegionIndexRequest { string known_version = 1; }
message GetRegionIndexResponse {
  string version = 1;
  bool not_modified = 2;
  // Public province/city IDs and names, never geometry or private data.
  string index_json = 3;
  repeated RegionMapping mappings = 4;
  repeated string supported_versions = 5;
}
message PreviewRegionUpgradeRequest {}
message RegionUpgradeChange {
  string from_code = 1;
  string to_code = 2;
  string from_name = 3;
  string to_name = 4;
  string from_province = 5;
  string to_province = 6;
  // An ID-only association left after cancelling its city footprint.
  bool media_only = 7;
}
message PreviewRegionUpgradeResponse {
  string version = 1;
  int64 revision = 2;
  repeated RegionUpgradeChange changes = 3;
  // Unmapped/colliding regions stop the entire upgrade. No data is dropped.
  repeated string blockers = 4;
}
message ApplyRegionUpgradeRequest {
  string version = 1;
  int64 base_revision = 2;
  string mutation_id = 3;
}
message ApplyRegionUpgradeResponse {
  string version = 1;
  int64 revision = 2;
  int32 changed_count = 3;
  bool replayed = 4;
  // Immutable snapshot captured before any changing upgrade.
  string snapshot_id = 5;
}
