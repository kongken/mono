syntax = "proto3";
package bff.timeline.v1;
option go_package = "github.com/kongken/mono/pkg/proto/bff/timeline/v1;bfftimelinev1";
import "google/protobuf/timestamp.proto";
import "bff/timeline/v1/timeline.proto";
service MediaService {
 rpc PrepareUpload(PrepareUploadRequest) returns (PrepareUploadResponse);
 rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
 rpc ListMedia(ListMediaRequest) returns (ListMediaResponse);
 rpc ReadMedia(ReadMediaRequest) returns (ReadMediaResponse);
 rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);
}
message MediaInfo { string media_ref=1; string entry_ref=2; string filename=3; string content_type=4; int64 size_bytes=5; string status=6; google.protobuf.Timestamp created_at=7; }
message PrepareUploadRequest { string entry_ref=1; string filename=2; string content_type=3; int64 size_bytes=4; string mutation_id=5; }
message PrepareUploadResponse { MediaInfo media=1; string upload_url=2; map<string,string> headers=3; google.protobuf.Timestamp expires_at=4; }
message CompleteUploadRequest { string media_ref=1; string mutation_id=2; }
message CompleteUploadResponse { MediaInfo media=1; }
message ListMediaRequest { string entry_ref=1; }
message ListMediaResponse { repeated MediaInfo media=1; }
message ReadMediaRequest { string media_ref=1; }
message ReadMediaResponse { bytes data=1; string content_type=2; string filename=3; }
message DeleteMediaRequest { string media_ref=1; string mutation_id=2; int64 expected_revision=3; }
message DeleteMediaResponse { bff.timeline.v1.MutationReceipt receipt=1; }
