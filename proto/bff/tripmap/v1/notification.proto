syntax = "proto3";

package bff.tripmap.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kongken/mono/pkg/proto/bff/tripmap/v1;bfftripmapv1";

// NotificationService manages reminder preferences, email verification and push
// subscriptions for the signed-in user via the BFF.
service NotificationService {
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);
  rpc RemoveEmail(RemoveEmailRequest) returns (RemoveEmailResponse);
  rpc RegisterPushSubscription(RegisterPushSubscriptionRequest) returns (RegisterPushSubscriptionResponse);
  rpc RemovePushSubscription(RemovePushSubscriptionRequest) returns (RemovePushSubscriptionResponse);
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);
}

message NotificationPreference {
  string kind = 1;
  string channel = 2;
  bool enabled = 3;
}

message NotificationSettings {
  repeated NotificationPreference preferences = 1;
  string timezone = 2;
  int32 send_hour = 3;
  bool show_places = 4;
  string email_masked = 5;
  bool email_verified = 6;
  string pending_email_masked = 7;
  google.protobuf.Timestamp pending_expires_at = 8;
  int32 push_subscription_count = 9;
}

message GetNotificationSettingsRequest {}

message GetNotificationSettingsResponse {
  NotificationSettings settings = 1;
  bool email_available = 2;
  bool push_available = 3;
  string vapid_public_key = 4;
}

message UpdateNotificationSettingsRequest {
  repeated NotificationPreference preferences = 1;
  string timezone = 2;
  int32 send_hour = 3;
  bool show_places = 4;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message RequestEmailVerificationRequest {
  string email = 1;
}

message RequestEmailVerificationResponse {
  string pending_email_masked = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ConfirmEmailRequest {
  string code = 1;
}

message ConfirmEmailResponse {
  NotificationSettings settings = 1;
}

message RemoveEmailRequest {}

message RemoveEmailResponse {
  NotificationSettings settings = 1;
}

message RegisterPushSubscriptionRequest {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

message RegisterPushSubscriptionResponse {
  int32 push_subscription_count = 1;
}

message RemovePushSubscriptionRequest {
  string endpoint = 1;
}

message RemovePushSubscriptionResponse {
  int32 push_subscription_count = 1;
}

message SendTestNotificationRequest {
  string channel = 1;
}

message SendTestNotificationResponse {
  int32 delivered = 1;
}
