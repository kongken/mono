syntax = "proto3";

package bff.tripmap.v1;

import "google/protobuf/timestamp.proto";
import "bff/tripmap/v1/footprint.proto";

option go_package = "github.com/kongken/mono/pkg/proto/bff/tripmap/v1;bfftripmapv1";

// SnapshotService exposes signed-in cloud snapshot list, create, read and restore via the BFF.
service SnapshotService {
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);
}

message SnapshotInfo {
  string id = 1;
  string reason = 2;
  google.protobuf.Timestamp created_at = 3;
  int32 visit_count = 4;
  int32 province_mark_count = 5;
  int64 revision = 6;
  int32 trip_count = 7;
  int32 schema_version = 8;
}

message SnapshotData {
  repeated Visit visits = 1;
  repeated ProvinceMark province_marks = 2;
  repeated Trip trips = 3;
  int32 schema_version = 4;
  string region_version = 5;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message CreateSnapshotRequest {
  string reason = 1;
}

message CreateSnapshotResponse {
  SnapshotInfo snapshot = 1;
  bool created = 2;
}

message GetSnapshotRequest {
  string id = 1;
}

message GetSnapshotResponse {
  SnapshotInfo snapshot = 1;
  SnapshotData data = 2;
}

message RestoreSnapshotRequest {
  string snapshot_id = 1;
  int64 base_revision = 2;
  string mutation_id = 3;
}

message RestoreSnapshotResponse {
  int64 revision = 1;
  int32 changed_count = 2;
  SnapshotInfo undo_snapshot = 3;
  bool replayed = 4;
}
