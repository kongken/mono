syntax = "proto3";

package bff.v1;

import "google/protobuf/timestamp.proto";
import "platform/v1/options.proto";

option go_package = "github.com/kongken/mono/pkg/proto/bff/v1;bffv1";

// UserAdminService is the browser interface of the unified admin console's user
// section: finding accounts, reading what an administrator may know about them, and
// four narrow changes to ordinary accounts (disable, enable, grant and revoke the
// metro-admin role). Nothing else can be changed from the web: no free role name or
// field list, no platform role, no change to an account that holds the platform role,
// no password, no impersonation, no deletion, and a deleting account cannot be enabled.
//
// Every method is a management procedure and is refused unless ALL of these hold,
// each checked independently of the others (a failure of any is the same refusal,
// so a caller cannot tell which one it missed):
//
//   - the caller's address (resolved from the trusted proxy chain, never from a
//     header the caller controls) is inside admin.allowed_cidrs; an empty list
//     refuses everything;
//   - the Origin header is exactly the admin console's registered origin
//     (navigation.apps.admin.origin), not a product origin and not absent;
//   - the Cookie session is valid and its account is active with an unchanged
//     auth_version (checked with usersrv on every call);
//   - the session holds the platform role ozid-admin now (metro-admin is not enough,
//     and ozid-admin does not imply any metro role);
//   - the password was verified within admin_session_max_age (re-authenticate at
//     OzID, which returns UNAUTHENTICATED "sign in again to use this feature" here).
//
// The BFF then calls usersrv.v1.UserAdminService, which checks the role again. The
// reads are exempt from CSRF (they change nothing) but not from any check above.
// Each operator may make 120 reads a minute (RESOURCE_EXHAUSTED beyond that; a
// failing limiter store refuses the call). Errors never carry internal detail.
//
// A write (DisableUser, EnableUser, GrantMetroAdmin, RevokeMetroAdmin) additionally
// needs, in the same independent way:
//
//   - the CSRF token (X-CSRF-Token against the session's), which no read needs;
//   - a real password check on this session within the last 15 minutes (the session's
//     authentication time, set only by a password check; a client cannot supply or
//     extend it); otherwise FAILED_PRECONDITION "enter your password again to continue".
//     The console sends the administrator to OzID and back; the refused write is never
//     replayed automatically;
//   - at most 30 writes a minute per operator (RESOURCE_EXHAUSTED; a failing limiter
//     store refuses the call).
//
// The operator and the authentication time come from the trusted session only; no
// request field names either. usersrv decides the target constraints again and
// independently. Write errors:
//
//	INVALID_ARGUMENT     reason or key malformed (metadata names the field)
//	NOT_FOUND            no such account
//	FAILED_PRECONDITION  "platform administrators cannot be changed here" (target holds
//	                     ozid-admin); "account is not active" (a deleting account, or
//	                     granting to an account that is not active and verified);
//	                     "enter your password again to continue" (recent password)
//	ABORTED              "account changed since it was read": nothing changed, read again
//	ALREADY_EXISTS       "mutation id used for a different request"
service UserAdminService {
  // ListUsers pages through accounts newest first, 50 per page by default and 100 at most.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
  // GetUser reads one account by UUID; NOT_FOUND when there is none.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
  // ListSecurityAudit pages through the account security and administration audit, newest
  // first (created_at, then id, both descending). The read is itself audited
  // (admin.audit.list, filters used and never their values) in the same transaction.
  rpc ListSecurityAudit(ListSecurityAuditRequest) returns (ListSecurityAuditResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
  // DisableUser disables an active account: its sessions and access tokens stop
  // working at their next check. Already disabled is a normal "unchanged" answer.
  rpc DisableUser(ChangeUserRequest) returns (ChangeUserResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
  // EnableUser enables a disabled account. Older sessions and tokens stay dead.
  rpc EnableUser(ChangeUserRequest) returns (ChangeUserResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
  // GrantMetroAdmin gives metro-admin to an active, verified account.
  rpc GrantMetroAdmin(ChangeUserRequest) returns (ChangeUserResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
  // RevokeMetroAdmin removes metro-admin.
  rpc RevokeMetroAdmin(ChangeUserRequest) returns (ChangeUserResponse) {
    option (platform.v1.required_role) = "ozid-admin";
  }
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
  // The account is being closed; read-only, "enable" never cancels a deletion.
  USER_STATUS_DELETING = 3;
}

// AdminUser is one account as an administrator may see it. There is no password
// hash, token, session, product data or profile of any product here.
message AdminUser {
  string user_id = 1;
  // The canonical login email. Administrator-only; never shown to metro-admin.
  string email = 2;
  string display_name = 3;
  UserStatus status = 4;
  // Current role names, sorted.
  repeated string roles = 5;
  google.protobuf.Timestamp created_at = 6;
  // The version of the account this view is of. A write names it as
  // expected_auth_version; if the account changed in between, the write is refused.
  int64 auth_version = 7;
}

message ListUsersRequest {
  // At most one of email, user_id and nickname.
  //
  // Exact lookup by login email (normalised: case and surrounding spaces do not matter).
  string email = 1;
  // Exact lookup by user UUID.
  string user_id = 2;
  // Literal, case-insensitive substring of the nickname, 1-40 characters.
  string nickname = 3;
  UserStatus status = 4;
  // "metro-admin" or "ozid-admin"; empty means any.
  string role = 5;
  // 0 means 50; at most 100.
  int32 page_size = 6;
  // From the previous response, with the same filters; empty starts over.
  string page_token = 7;
}

message ListUsersResponse {
  repeated AdminUser users = 1;
  // Empty at the last page.
  string next_page_token = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  AdminUser user = 1;
}

// ChangeUserRequest asks for one change to one account; the method names the change.
// It carries no operator and no role or status: the operator is the signed-in session.
message ChangeUserRequest {
  string user_id = 1;
  // The auth_version of the AdminUser the administrator is looking at.
  int64 expected_auth_version = 2;
  // Idempotency key: 1-64 characters of A-Z a-z 0-9 . _ -. Generate a new one for every
  // intended change and keep it across retries of that same change (a lost response
  // is retried with the same key and gets the first answer back). Receipts last 24
  // hours and belong to the operator.
  string mutation_id = 3;
  // Why, 1-200 characters, no control characters and no email address, password or
  // token. Required; kept in the audit record.
  string reason = 4;
}

message ChangeUserResponse {
  string user_id = 1;
  UserStatus status = 2;
  // Roles after the change, sorted.
  repeated string roles = 3;
  // The new version: the one the next write must name.
  int64 auth_version = 4;
  // False when the account was already in the requested state (nothing was changed).
  bool changed = 5;
  // True when this is the stored answer to an earlier identical request.
  bool replayed = 6;
}

// AuditChannel says where the actor of an audit row came from. It is derived from stored
// data, never from the request.
enum AuditChannel {
  AUDIT_CHANNEL_UNSPECIFIED = 0;
  // An administrator in the console. operator_user_id is the real account.
  AUDIT_CHANNEL_WEB = 1;
  // The operator CLI. operator_label is its controlled operator name, which is not an
  // account and never an identity of a web actor.
  AUDIT_CHANNEL_CLI = 2;
  // The account's own holder (sign-in, password, deletion). operator_user_id is the holder.
  AUDIT_CHANNEL_SELF = 3;
  // A background or anonymous flow.
  AUDIT_CHANNEL_SYSTEM = 4;
}

// ListSecurityAuditRequest filters the account security and administration audit. Every
// field narrows the result; none is required. Filter values are never logged or recorded
// (only which filters were used).
message ListSecurityAuditRequest {
  // The account the rows are about (UUID).
  string user_id = 1;
  // The administrator or account holder who acted (UUID).
  string operator_user_id = 2;
  AuditChannel channel = 3;
  // Exact action as stored, e.g. "admin.account.disable", "role.grant:metro-admin", "login".
  string action = 4;
  // Exact result as stored, e.g. "ok", "unchanged", "refused_version_conflict".
  string result = 5;
  // Exact idempotency key. Keys are reusable once a receipt expires and refused attempts
  // may use any key, so this lists every row that used the key, over every use of it.
  string mutation_id = 6;
  // Inclusive lower and exclusive upper bound of the row's time.
  google.protobuf.Timestamp from = 7;
  google.protobuf.Timestamp to = 8;
  // 0 means 50; at most 100.
  int32 page_size = 9;
  // From the previous response, with the same filters; empty starts at the newest row.
  string page_token = 10;
}

// SecurityAuditEntry is one audit row as an administrator may see it: identifiers, fixed
// classifications, the operator's reason and the status and roles before and after. It has
// no email, password, token, session, raw request or product data.
message SecurityAuditEntry {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  AuditChannel channel = 3;
  // Web: the administrator's account. Self: the holder. Empty for the CLI and the system.
  string operator_user_id = 4;
  // CLI: the controlled operator name ("system" for the system). Empty for web and self.
  string operator_label = 5;
  // The account the row is about; empty when there is none.
  string user_id = 6;
  string action = 7;
  string result = 8;
  // The operator's reason (changes) or a redacted description of a read (filters used,
  // never their values).
  string reason = 9;
  string request_id = 10;
  string mutation_id = 11;
  // Account status ("active", "disabled", "deleting") and role names around a change;
  // empty when the row is not a state change, and always empty on a replayed row.
  string before_status = 12;
  string after_status = 13;
  repeated string before_roles = 14;
  repeated string after_roles = 15;
  // Only on a replayed row: the id of the row of the change whose stored answer was handed
  // out again. This link is exact. The mutation id is not: it can be used again later.
  // Empty if the receipt predates the link.
  string origin_id = 16;
  // The summary of that row, when it is still kept. A replayed row never states a state
  // itself: the origin has the real before/after.
  SecurityAuditOrigin origin = 17;
}

// SecurityAuditOrigin summarises the change a replayed row points at.
message SecurityAuditOrigin {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  string action = 3;
  string result = 4;
  string before_status = 5;
  string after_status = 6;
  repeated string before_roles = 7;
  repeated string after_roles = 8;
}

message ListSecurityAuditResponse {
  repeated SecurityAuditEntry entries = 1;
  // Empty at the last page.
  string next_page_token = 2;
}
