syntax = "proto3";

package bff.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kongken/mono/pkg/proto/bff/v1;bffv1";

// FriendService exposes friendships, privacy settings and friend footprint comparison via the BFF.
// Shared-trip mutations remain on tripmap.v1 until a follow-up slice; overview may list shared trips read-only.
service FriendService {
  rpc GetCollaborationOverview(GetCollaborationOverviewRequest) returns (GetCollaborationOverviewResponse);
  rpc UpdateFriendSettings(UpdateFriendSettingsRequest) returns (UpdateFriendSettingsResponse);
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  rpc RespondFriendRequest(RespondFriendRequestRequest) returns (RespondFriendRequestResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc GetFriendFootprints(GetFriendFootprintsRequest) returns (GetFriendFootprintsResponse);
}

message FriendUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
}

message FriendShareSettings {
  bool show_cities = 1;
  bool show_dates = 2;
  bool show_notes = 3;
}

message FriendshipInfo {
  string id = 1;
  FriendUser friend = 2;
  string status = 3;
  string direction = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp accepted_at = 6;
}

message SharedTripMember {
  FriendUser user = 1;
  string role = 2;
  string status = 3;
  google.protobuf.Timestamp joined_at = 4;
}

message SharedTripInfo {
  string id = 1;
  string region_code = 2;
  string region_name = 3;
  string province_code = 4;
  string trip_id = 5;
  string date = 6;
  string note = 7;
  FriendUser owner = 8;
  string my_role = 9;
  string my_status = 10;
  repeated SharedTripMember members = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GetCollaborationOverviewRequest {}

message GetCollaborationOverviewResponse {
  string my_friend_code = 1;
  FriendShareSettings friend_settings = 2;
  repeated FriendshipInfo friends = 3;
  repeated SharedTripInfo shared_trips = 4;
}

message UpdateFriendSettingsRequest {
  FriendShareSettings settings = 1;
}

message UpdateFriendSettingsResponse {
  FriendShareSettings settings = 1;
}

message SendFriendRequestRequest {
  string target = 1;
}

message SendFriendRequestResponse {
  FriendshipInfo friendship = 1;
}

message RespondFriendRequestRequest {
  string friendship_id = 1;
  bool accept = 2;
}

message RespondFriendRequestResponse {
  FriendshipInfo friendship = 1;
}

message RemoveFriendRequest {
  string friendship_id = 1;
}

message RemoveFriendResponse {}

message FriendSharedCity {
  string code = 1;
  string name = 2;
  string province = 3;
  string my_color = 4;
  string friend_color = 5;
}

message FriendComparison {
  repeated string common_provinces = 1;
  repeated string only_me_provinces = 2;
  repeated string only_friend_provinces = 3;
  repeated FriendSharedCity common_cities = 4;
  int32 my_only_city_count = 5;
  int32 friend_only_city_count = 6;
  bool city_comparison_available = 7;
}

message GetFriendFootprintsRequest {
  string friend_user_id = 1;
}

message GetFriendFootprintsResponse {
  FriendUser friend = 1;
  FriendShareSettings friend_settings = 2;
  string content_json = 3;
  FriendComparison comparison = 4;
}
