syntax = "proto3";

package bff.v1;

import "platform/v1/options.proto";

option go_package = "github.com/kongken/mono/pkg/proto/bff/v1;bffv1";

// StatusService is the browser-facing readiness report. It carries no user data.
service StatusService {
  // GetStatus reports the readiness of the services behind the BFF.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (platform.v1.anonymous) = true;
  }
}

message GetStatusRequest {}

message GetStatusResponse {
  // True when every dependency is ready.
  bool ready = 1;
  repeated DependencyStatus dependencies = 2;
  // Highest footprint schema the backend understands (2 = multiple trips per
  // city). Zero means an older backend; clients must not send trip data to it.
  int32 footprint_schema = 3;
  // True when the backend has public sharing configured.
  bool share_enabled = 4;
  // Digest of the exact bundled region index and its reviewed migration rules.
  string region_version = 5;
}

message DependencyStatus {
  string name = 1;
  bool ready = 2;
}
