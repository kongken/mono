syntax = "proto3";

package bff.v1;

import "google/protobuf/timestamp.proto";
import "platform/v1/options.proto";

option go_package = "github.com/kongken/mono/pkg/proto/bff/v1;bffv1";

// AuthService handles Logto-backed browser sessions (HttpOnly Cookie).
// Password and SPA OAuth RPCs are retired, unimplemented compatibility stubs.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option deprecated = true;
    option (platform.v1.anonymous) = true;
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option deprecated = true;
    option (platform.v1.anonymous) = true;
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  // ListSessions lists the caller's active browser sessions in BFF storage.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession revokes one of the caller's own sessions.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // DeleteAccount deletes application cloud data, NOT the Logto account.
  // Requires a BFF session issued within 15 minutes; cleanup retries are exempt.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // IssueCSRFToken sets the CSRF cookie and returns the token for double-submit checks.
  rpc IssueCSRFToken(IssueCSRFTokenRequest) returns (IssueCSRFTokenResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc ListOAuthProviders(ListOAuthProvidersRequest) returns (ListOAuthProvidersResponse) {
    option (platform.v1.anonymous) = true;
  }
  rpc BeginOAuthFlow(BeginOAuthFlowRequest) returns (BeginOAuthFlowResponse) {
    option deprecated = true;
    option (platform.v1.anonymous) = true;
  }
  rpc CompleteOAuthFlow(CompleteOAuthFlowRequest) returns (CompleteOAuthFlowResponse) {
    option deprecated = true;
    option (platform.v1.anonymous) = true;
  }
}

message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp last_used_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // True for the session that made this request.
  bool current = 5;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  google.protobuf.Timestamp created_at = 5;
  bool deletion_pending = 6;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
}

message RegisterResponse {
  User user = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
  // Roles the Logto account held when this session was signed in, such as
  // "metro-admin". Clients may use them to show or hide entry points only;
  // every server call checks the role again. Sessions created before roles were
  // recorded have none.
  repeated string roles = 2;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string id = 1;
}

message RevokeSessionResponse {}

message DeleteAccountRequest {
  // Must be exactly "DELETE".
  string confirmation = 1;
  reserved 2;
  reserved "password";
}

message DeleteAccountResponse {}

message IssueCSRFTokenRequest {}

message IssueCSRFTokenResponse {
  string token = 1;
}

message OAuthProvider {
  string name = 1;
  string display_name = 2;
}

message ListOAuthProvidersRequest {}

message ListOAuthProvidersResponse {
  repeated OAuthProvider providers = 1;
}

message BeginOAuthFlowRequest {
  string provider = 1;
}

message BeginOAuthFlowResponse {
  string authorize_url = 1;
  string state = 2;
}

message CompleteOAuthFlowRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
}

message CompleteOAuthFlowResponse {
  User user = 1;
  google.protobuf.Timestamp expires_at = 2;
}
