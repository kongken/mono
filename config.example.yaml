# Local-only sample. Copy to ignored config.yaml; replace credentials for deployment.
# Butterfly reads literal YAML; ${VAR} substitutions are not supported.
log:
  level: info
  format: text
  add_source: false

db_store: main
redis_store: main
# Ent creates/adds tables locally. Disable this after planning production migrations.
auto_migrate: true
storage:
  s3_store: main
  key_prefix: tripmap

# Business RPCs on gRPC/TLS only; HTTP is /ping and /readyz (internal). Do not expose 18082/18083 publicly.
grpc:
  listen: 127.0.0.1:18083
  cert_file: dev-secrets/tripmap.pem
  key_file: dev-secrets/tripmap.key
  # max_message_bytes: 20971520   # default 20 MiB; the largest legitimate request is 16 MiB

# Only calls carrying a credential signed by one of these BFF keys are accepted.
# During rotation list the old and the new key together.
internal_auth:
  issuer: tripmap-bff
  audience: tripmap
  trusted_keys:
    - kid: dev-1
      public_key_file: dev-secrets/bff.pub
  # clock_skew: 10s

auth:
  # Client address for share/unsubscribe rate limits when those routes are mounted in tests.
  # Production public HTTP is served by the BFF; account/OAuth/session config is in config.bff.yaml.
  client_ip_header: X-Real-IP

# Public share page (F6). Sharing is off while public_base_url is empty.
# share:
#   # The address visitors use. Links are public_base_url + /s/<token>; /s/ and
#   # /api/share/ must reach this backend (the Vite proxy and the front image's Nginx do).
#   public_base_url: http://localhost:5173
#   # Trusted front-end index.html used for Open Graph tags; never user-controlled.
#   app_index_url: http://localhost:5173/
#   # Vite's development server needs inline scripts; leave empty in production.
#   # html_csp: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws:"

# Optional Mapbox basemap proxy: GET /api/tiles/{z}/{x}/{y}.png, reached through the BFF.
# Off by default; while off the route answers 404 and never contacts Mapbox. The token
# stays here (never in the front end); rotate it by editing it and restarting tripmap.
# Use a public (pk.) token limited to the styles:tiles scope; sk. tokens are refused. Mapbox bills 256 px tiles as four requests
# each, and the front end must set VITE_OSM_TILE_URL and VITE_OSM_TILE_PROVIDER=mapbox.
# mapbox_tiles:
#   enabled: true
#   token: pk.replace-with-your-token.replace-with-your-token
#   username: mapbox        # the account that owns the style
#   style_id: light-v11
#   # style_version: 2026-10    # optional label; tile URLs carry ?v=<it>. Change it (and the front end's
#   #                           # VITE_OSM_TILE_VERSION) together with username/style_id to switch styles
#   # max_zoom: 18              # 1-22, default 18
#   # rate_per_minute: 600      # per client address, default 600
#   # upstream_timeout: 5s      # default 5s, at most 30s
#   # max_response_bytes: 524288  # default 512 KiB

# Reminders and notifications (F12). Every channel is off until configured.
# notification:
#   # The site address people use. Email links and tapped push notifications are built
#   # from it; /api/ must reach this backend (the Vite proxy and the front image's Nginx do).
#   public_base_url: http://localhost:5173
#   # Signs unsubscribe links in emails, at least 32 characters. Keep it secret and stable:
#   # changing it invalidates links already sent.
#   secret: "change-me-to-a-random-string-of-32-chars-or-more"
#   smtp:
#     host: smtp.example.com
#     port: 587
#     username: ""
#     password: ""
#     from: "山海足迹 <noreply@example.com>"
#     tls: starttls   # starttls (default), tls (implicit, usually port 465) or none (local test server only)
#   web_push:
#     # make vapid-keys prints a new pair. Browsers need HTTPS (localhost is allowed).
#     vapid_public_key: ""
#     vapid_private_key: ""
#     subject: mailto:you@example.com

store:
  db:
    main:
      driver: postgres
      host: 127.0.0.1
      port: 15432
      user: tripmap
      password: tripmap-local
      db_name: tripmap
      ssl_mode: disable
  redis:
    main:
      addr: 127.0.0.1:16379
      password: tripmap-local
      db: 0
  s3:
    main:
      endpoint: http://127.0.0.1:19000
      region: us-east-1
      bucket: tripmap
      access_key_id: tripmap-local
      secret_access_key: tripmap-local-secret
      use_path_style: true
      use_ssl: false
