# Local-only sample. Copy to ignored config.yaml; replace credentials for deployment.
# Butterfly reads literal YAML; ${VAR} substitutions are not supported.
log:
  level: info
  format: text
  add_source: false

db_store: main
redis_store: main
# Ent creates/adds tables locally. Disable this after planning production migrations.
auto_migrate: true
storage:
  s3_store: main
  key_prefix: tripmap

auth:
  session_ttl: 168h
  # registration_disabled: true
  # Only behind a trusted reverse proxy that sets this header.
  # client_ip_header: CF-Connecting-IP
  # Exact browser origins allowed to call the API from another site.
  # cors_allowed_origins: ["http://localhost:5173"]
  # OAuth sign-in; a provider is offered only when client_id and client_secret are set.
  # redirect_url must be the frontend callback page registered with the OAuth app.
  oauth_providers:
    github:
      client_id: ""
      client_secret: ""
      redirect_url: http://localhost:5173/auth/callback/github
    google:
      client_id: ""
      client_secret: ""
      redirect_url: http://localhost:5173/auth/callback/google

# Public share page (F6). Sharing is off while public_base_url is empty.
# share:
#   # The address visitors use. Links are public_base_url + /s/<token>; /s/ and
#   # /api/share/ must reach this backend (the Vite proxy and the front image's Nginx do).
#   public_base_url: http://localhost:5173
#   # Trusted front-end index.html used for Open Graph tags; never user-controlled.
#   app_index_url: http://localhost:5173/
#   # Vite's development server needs inline scripts; leave empty in production.
#   # html_csp: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws:"

store:
  db:
    main:
      driver: postgres
      host: 127.0.0.1
      port: 15432
      user: tripmap
      password: tripmap-local
      db_name: tripmap
      ssl_mode: disable
  redis:
    main:
      addr: 127.0.0.1:16379
      password: tripmap-local
      db: 0
  s3:
    main:
      endpoint: http://127.0.0.1:19000
      region: us-east-1
      bucket: tripmap
      access_key_id: tripmap-local
      secret_access_key: tripmap-local-secret
      use_path_style: true
      use_ssl: false
