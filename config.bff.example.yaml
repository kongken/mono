# Local-only sample for the BFF, the public entry in front of every business service.
# Copy to ignored config.bff.yaml. Butterfly reads literal YAML; ${VAR} is not expanded.
log:
  level: info
  format: text
  add_source: false

db_store: main
redis_store: main
key_prefix: bff
auto_migrate: true

upstreams:
  tripmap: http://127.0.0.1:18082

grpc:
  ca_file: dev-secrets/ca.pem
  services:
    tripmap:
      address: 127.0.0.1:18083

internal_auth:
  issuer: tripmap-bff
  kid: dev-1
  private_key_file: dev-secrets/bff.key

auth:
  session_ttl: 168h
  csrf_token_ttl: 24h    # optional; default 24h when unset
  cookie_secure: false   # true in production (HTTPS); Vite dev proxy is same-origin HTTP
  # registration_disabled: true
  # Explicit loopback-only HTTP exception for local OAuth development.
  # Production: remove oauth_development, set cookie_secure: true, use HTTPS.
  oauth_development: true
  oauth_apps:
    trip-map:
      origin: http://localhost:5173
      default_path: /
      allowed_paths: [/]
    second-app:
      origin: http://localhost:5174
      default_path: /map
      allowed_paths: [/map]
  # oauth_providers:
  #   logto:
  #     issuer_url: https://tenant.logto.app/oidc
  #     client_id: local-client
  #     client_secret: replace-in-ignored-config
  #     redirect_url: http://localhost:5173/auth/callback/logto
  #   github:
  #     client_id: local-client
  #     client_secret: replace-in-ignored-config
  #     redirect_url: http://localhost:5173/auth/callback/github

# Exact origins for direct BFF access. Same-origin /api proxy needs none.
cors_allowed_origins:
  - http://localhost:5173
  - http://localhost:5174

client_ip_header: X-Real-IP

store:
  db:
    main:
      driver: postgres
      host: 127.0.0.1
      port: 15432
      user: tripmap
      password: tripmap-local
      db_name: bff
      ssl_mode: disable
  redis:
    main:
      addr: 127.0.0.1:16379
      password: tripmap-local
      db: 0
