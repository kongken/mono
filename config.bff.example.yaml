# Local-only sample for the BFF, the public entry in front of every business service.
# Copy to ignored config.bff.yaml. Butterfly reads literal YAML; ${VAR} is not expanded.
log:
  level: info
  format: text
  add_source: false

db_store: main
redis_store: main
key_prefix: bff
auto_migrate: true

upstreams:
  # usersrv is the account service (sign-in, registration, password, roles). It is required.
  usersrv: http://127.0.0.1:18086
  tripmap: http://127.0.0.1:18082
  # metro (the second product) is optional: remove this line, grpc.services.metro and
  # auth.account_cleanup's metro entry to run the BFF without it.
  metro: http://127.0.0.1:18084

grpc:
  # Local loopback uses h2c: no CA or server_name. For TLS, run
  # `go run ./cmd/dev-secrets -tls`, set transport: tls and add ca_file.
  # ca_file: dev-secrets/ca.pem
  services:
    # usersrv trusts this BFF's public key (internal_auth.trusted_keys in its config).
    usersrv:
      address: 127.0.0.1:18087
      transport: h2c
    tripmap:
      address: 127.0.0.1:18083
      # Unencrypted HTTP/2; only for loopback or an explicitly approved trusted network.
      # Must match tripmap's grpc.transport; signatures remain required.
      transport: h2c
    metro:
      address: 127.0.0.1:18085
      transport: h2c

internal_auth:
  issuer: tripmap-bff
  kid: dev-1
  private_key_file: dev-secrets/bff.key
  # Alternatively REMOVE private_key_file and paste your PKCS#8 Ed25519 PEM:
  # private_key: |
  #   -----BEGIN PRIVATE KEY-----
  #   <your base64-encoded key>
  #   -----END PRIVATE KEY-----
  # Keep private key content only in ignored config or a Secret, never in Git.

# The metro MCP endpoint (POST /mcp/metro, Bearer management token). Served only
# when upstreams.metro is configured.
mcp:
  rate_limit_per_minute: 60

auth:
  session_ttl: 168h
  # Procedures that declare required_role (the metro admin API) need a session whose
  # password was last checked (sign-in or Reauthenticate) within this long. The role
  # itself is read from usersrv on every request. Default 12h.
  admin_session_max_age: 12h
  # Products whose data account deletion removes; each needs its upstream.
  # Default: tripmap only.
  account_cleanup: [tripmap, metro]
  csrf_token_ttl: 24h    # optional; default 24h when unset
  cookie_secure: false   # true in production (HTTPS); Vite dev proxy is same-origin HTTP

# Exact origins for direct BFF access. Same-origin /api proxy needs none.
cors_allowed_origins:
  - http://localhost:5173
  - http://localhost:5174
  - http://localhost:5175   # OzID
  - http://localhost:5176   # admin console

# OzID (the user center) and the apps it may send the browser back to after sign-in or password
# confirmation. A request names an app ID and a path; the server builds the address from this
# registry and nothing the client sends can add an origin. Every origin must be in
# cors_allowed_origins and in the same site as api_origin (the session Cookie is host-only on
# the API, and the browser sends it to any same-site front end that CORS allows, so the exact
# CORS list above is what keeps unlisted siblings out). Production values are https only
# (required when auth.cookie_secure is true); the examples below use reserved names:
#   api_origin: https://api.example.com
#   apps:
#     ozid:     {origin: https://id.example.com, paths: ["/security"]}
#     trip-map: {origin: https://trip.example.com}
#     metro:    {origin: https://metro.example.com, paths: ["/me", "/city/*"]}
#     admin:    {origin: https://admin.example.com, paths: ["/users", "/users/*"]}
# Omit the section to run without OzID: the navigation procedure then answers FAILED_PRECONDITION.
navigation:
  api_origin: http://localhost:18081
  apps:
    ozid:     {origin: http://localhost:5175, paths: ["/security"]}
    trip-map: {origin: http://localhost:5173}
    metro:    {origin: http://localhost:5174, paths: ["/me", "/city/*"]}
    admin:    {origin: http://localhost:5176, paths: ["/users", "/users/*"]}

# The unified management console's perimeter (apps/admin, deploy/admin-web, docs/admin/features.md).
# It guards every user-management API (and, with the console gateway, the console's pages and
# assets): source network, the console's Origin (navigation.apps.admin.origin, one value), a valid
# session and the platform role are all checked here, on every call, independently of the gateway.
#   allowed_cidrs   networks that may use the console. EMPTY DENIES EVERYTHING. Entries need a
#                   prefix and no host bits; IPv4 wider than /8, IPv6 wider than /16 and
#                   IPv4-mapped IPv6 are refused at startup (a fully open list is never valid).
#   trusted_proxies networks of the reverse proxies that connect to the BFF directly. Only then is
#                   forwarded_header read (right to left, skipping these hops); empty = the TCP
#                   peer is the client and no header is believed. The proxy must APPEND to the
#                   header, never pass a client's value through.
# Production example (reserved addresses; never commit real ones):
#   admin:
#     allowed_cidrs: ["203.0.113.0/24", "2001:db8:100::/48"]
#     trusted_proxies: ["198.51.100.0/24"]
#     forwarded_header: X-Forwarded-For
#     rate_limit_per_minute: 120
# This development file only admits the machine itself.
admin:
  allowed_cidrs: ["127.0.0.0/8", "::1/128"]
  rate_limit_per_minute: 120

client_ip_header: X-Real-IP

store:
  db:
    main:
      driver: postgres
      host: 127.0.0.1
      port: 15432
      user: tripmap
      password: tripmap-local
      db_name: bff
      ssl_mode: disable
  redis:
    main:
      addr: 127.0.0.1:16379
      password: tripmap-local
      db: 0
