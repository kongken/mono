# Local-only Timeline service configuration.
log:
  level: info
  format: text
  add_source: false

db_store: timeline

auto_migrate: true

grpc:
  listen: 127.0.0.1:18089
  transport: h2c

storage:
  s3_store: timeline
  key_prefix: timeline/

internal_auth:
  issuer: tripmap-bff
  audience: timeline
  trusted_keys:
    - kid: dev-1
      public_key_file: dev-secrets/bff.pub

store:
  db:
    timeline:
      driver: postgres
      host: 127.0.0.1
      port: 15432
      user: tripmap
      password: tripmap-local
      db_name: timeline
      ssl_mode: disable
  s3:
    timeline:
      endpoint: http://127.0.0.1:19000
      region: us-east-1
      bucket: timeline
      access_key_id: timeline-local
      secret_access_key: timeline-local-secret
      use_path_style: true
      use_ssl: false
