# Local-only Timeline service configuration.
log:
  level: info
  format: text
  add_source: false

db_store: timeline

auto_migrate: true

grpc:
  listen: 127.0.0.1:18089
  transport: h2c

storage:
  s3_store: timeline
  key_prefix: timeline/

internal_auth:
  issuer: tripmap-bff
  audience: timeline
  trusted_keys:
    - kid: dev-1
      public_key_file: dev-secrets/bff.pub

store:
  db:
    timeline:
      driver: postgres
      host: 127.0.0.1
      port: 15432
      user: tripmap
      password: tripmap-local
      # Local development only: a separate database works because auto_migrate creates Timeline's own
      # tables. In production Timeline and Tripmap share ONE database (owner/ref foreign keys and the
      # mutation-receipt table cross the service boundary): set db_name to Tripmap's database,
      # auto_migrate to false, and run cmd/migrate-shared (docs/backend.md).
      db_name: timeline
      ssl_mode: disable
  s3:
    timeline:
      endpoint: http://s3:9000
      region: us-east-1
      bucket: timeline
      access_key_id: tripmap
      secret_access_key: change-me-secret
      use_path_style: true
      use_ssl: false
