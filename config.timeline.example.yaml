# Local-only Timeline service configuration.
log:
  level: info
  format: text
  add_source: false

db_store: timeline
auto_migrate: true

grpc:
  listen: 127.0.0.1:18089
  transport: h2c

internal_auth:
  issuer: tripmap-bff
  audience: timeline
  trusted_keys:
    - kid: dev-1
      file: dev-secrets/bff.pub
