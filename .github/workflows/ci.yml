name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tripmap
          POSTGRES_PASSWORD: tripmap-ci
          POSTGRES_DB: tripmap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tripmap" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: tripmap-ci
          RUSTFS_SECRET_KEY: tripmap-ci-secret
          RUSTFS_VOLUMES: /data
        ports: ["9000:9000"]
    env:
      TRIPMAP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TRIPMAP_TEST_S3_ACCESS_KEY: tripmap-ci
      TRIPMAP_TEST_S3_SECRET_KEY: tripmap-ci-secret
      TRIPMAP_TEST_S3_BUCKET: tripmap
      TRIPMAP_TEST_POSTGRES_DSN: postgres://tripmap:tripmap-ci@127.0.0.1:5432/tripmap?sslmode=disable
      TRIPMAP_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare isolated S3 test bucket
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          s=Path('config.example.yaml').read_text().replace('tripmap-local-secret','tripmap-ci-secret').replace('tripmap-local','tripmap-ci').replace('127.0.0.1:19000','127.0.0.1:9000')
          Path('/tmp/tripmap-ci.yaml').write_text(s)
          PYCODE
          go run ./cmd/storage-init -config /tmp/tripmap-ci.yaml
      - name: Vet
        run: go vet ./...
      # Includes the PostgreSQL/Redis-backed auth and footprint tests, which are
      # skipped when the TRIPMAP_TEST_* variables are absent.
      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:maps
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api
      - name: Browser acceptance (mocked RPC, no real OAuth)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
