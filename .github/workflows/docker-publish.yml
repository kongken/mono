name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tripmap
            suffix: '-tripmap'
            dockerfile: deploy/tripmap/Dockerfile
          - image: usersrv
            suffix: '-usersrv'
            dockerfile: deploy/usersrv/Dockerfile
          - image: trip-map-web
            suffix: '-trip-map-web'
            dockerfile: deploy/trip-map-web/Dockerfile
          - image: bff
            suffix: '-bff'
            dockerfile: deploy/bff/Dockerfile
          - image: metro
            suffix: '-metro'
            dockerfile: deploy/metro/Dockerfile
          # Like ozid-web: the browser calls the BFF's canonical address and sends account steps to OzID,
          # so the build needs both (no defaults). The published image is built for reserved example
          # addresses and is a build check, not a deployable.
          - image: metro-web
            suffix: '-metro-web'
            dockerfile: deploy/metro-web/Dockerfile
            build_args: |
              VITE_API_BASE_URL=https://api.example.com/api
              VITE_OZID_ORIGIN=https://id.example.com
          # Needs the BFF's public API base at build time (no default): pass the
          # VITE_API_BASE_URL build arg from a private deployment pipeline; the published
          # image is built for a reserved example address and is a build check, not a deployable.
          - image: ozid-web
            suffix: '-ozid-web'
            dockerfile: deploy/ozid-web/Dockerfile
            build_args: |
              VITE_API_BASE_URL=https://api.example.com/api
          # The unified management console: the same kind of build check. It also needs the OzID
          # origin at build time, and at run time ADMIN_HOST, ADMIN_ALLOWED_CIDRS and API_ORIGIN
          # (the container refuses to start without a usable allowlist).
          - image: admin-web
            suffix: '-admin-web'
            dockerfile: deploy/admin-web/Dockerfile
            build_args: |
              VITE_API_BASE_URL=https://api.example.com/api
              VITE_OZID_ORIGIN=https://id.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=raw,value=nightly,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # PRs and manual branch/tag builds reuse main's cache without retaining
          # another full set of BuildKit layers under each ref.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
