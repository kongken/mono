# Illustrative Secret keys for tripmap and BFF pods. Replace file paths and use your
# cluster's secret management; never commit real material.
apiVersion: v1
kind: Secret
metadata:
  name: tripmap-tls
type: Opaque
stringData:
  tripmap.pem: |
    # TLS certificate for grpc.listen (ECDSA, signed by your CA).
    # Only needed with grpc.transport: tls (default); omit this Secret for h2c.
  tripmap.key: |
    # Private key for tripmap.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: bff-internal-auth
type: Opaque
stringData:
  bff.key: |
    # Ed25519 PKCS#8 PEM — only on BFF pods; required for both tls and h2c
  bff.pub: |
    # PKIX PEM — mount on tripmap (trusted_keys) and keep for rotation
---
apiVersion: v1
kind: Secret
metadata:
  name: grpc-ca
type: Opaque
stringData:
  ca.pem: |
    # CA that signed tripmap.pem — BFF grpc.ca_file.
    # Only needed while some BFF upstream uses transport: tls; all-h2c needs none.
---
# usersrv (the account service). Same pattern as tripmap: the BFF signing PUBLIC key above is
# mounted here (internal_auth.trusted_keys), and its gRPC server certificate is only needed
# with grpc.transport: tls. Passwords cross this link, so production uses tls (or an
# explicitly approved encrypted tunnel / mesh), not h2c across hosts.
apiVersion: v1
kind: Secret
metadata:
  name: usersrv-tls
type: Opaque
stringData:
  usersrv.pem: |
    # TLS certificate for grpc.listen (SAN = the DNS name the BFF dials).
  usersrv.key: |
    # Private key for usersrv.pem
---
# usersrv account secrets. Three independent 32-byte random values (head -c 32 /dev/urandom | base64):
# never reuse one for another purpose, never store them in the same database as the data they protect.
apiVersion: v1
kind: Secret
metadata:
  name: usersrv-keys
type: Opaque
stringData:
  hmac.key: |
    # auth.hmac_key_file: keys the digests of rate-limit subjects in Redis.
  mail-encryption-1.key: |
    # mail.encryption.keys[].key_file for key id "1": encrypts queued account mail (AES-256-GCM).
    # Keep an old key listed until no job encrypted with it can still be queued.
---
# Mail vendor credential: only the active provider's section may be set in config.usersrv.yaml.
# Prefer a vendor key limited to "send mail". Real vendor delivery is verified by hand
# (docs/usersrv/mail-smoke-test.md), never by CI.
apiVersion: v1
kind: Secret
metadata:
  name: usersrv-mail
type: Opaque
stringData:
  config.usersrv.yaml: |
    # The whole usersrv configuration when the mail credential lives in the file (a Secret, not a ConfigMap).
