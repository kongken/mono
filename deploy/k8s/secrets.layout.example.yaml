# Illustrative Secret keys for tripmap and BFF pods. Replace file paths and use your
# cluster's secret management; never commit real material.
apiVersion: v1
kind: Secret
metadata:
  name: tripmap-tls
type: Opaque
stringData:
  tripmap.pem: |
    # TLS certificate for grpc.listen (ECDSA, signed by your CA).
    # Only needed with grpc.transport: tls (default); omit this Secret for h2c.
  tripmap.key: |
    # Private key for tripmap.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: bff-internal-auth
type: Opaque
stringData:
  bff.key: |
    # Ed25519 PKCS#8 PEM — only on BFF pods; required for both tls and h2c
  bff.pub: |
    # PKIX PEM — mount on tripmap (trusted_keys) and keep for rotation
---
apiVersion: v1
kind: Secret
metadata:
  name: grpc-ca
type: Opaque
stringData:
  ca.pem: |
    # CA that signed tripmap.pem — BFF grpc.ca_file.
    # Only needed while some BFF upstream uses transport: tls; all-h2c needs none.
