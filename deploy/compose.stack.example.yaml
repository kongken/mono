# Example production-style stack: trip-map-web (Nginx) + BFF + usersrv + tripmap + dependencies.
# usersrv is the account service and is required: the BFF has no other way to sign anyone in.
# metro (the second product) and metro-web are optional: delete both services, the
# `metro` upstream and grpc service in config.bff.yaml, the metro entries of
# auth.account_cleanup (and, during the transition, auth.apps.metro in config.usersrv.yaml) to run without it.
# Copy configs from config.usersrv.example.yaml / config.tripmap.example.yaml /
# config.bff.example.yaml; run `make dev-secrets` for signing keys, or configure inline PEM keys.
# Local configs use h2c (no TLS files). usersrv receives passwords from the BFF: in production
# use TLS (grpc.transport: tls, usersrv.pem/usersrv.key and the BFF's ca.pem), never plaintext
# between hosts. TLS deployments need explicit TLS config and certificates (see docs/deployment.md).
# usersrv, tripmap and metro HTTP/gRPC must NOT be published to the public internet.
# Every credential below (database, Redis, S3 passwords) is an example: replace it, and keep
# the mail provider key, auth.hmac_key and mail.encryption keys in mounted Secrets.

name: trip-map-stack
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripmap
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate bff, usersrv and metro databases on the first start of an empty
      # volume (tripmap uses POSTGRES_DB's default, "tripmap"). Existing volumes: create them by hand.
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmap"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "change-me"]
    networks: [internal]

  s3:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: tripmap
      RUSTFS_SECRET_KEY: change-me-secret
      RUSTFS_ADDRESS: ":9000"
    volumes: [s3-data:/data]
    networks: [internal]

  # usersrv owns the accounts: its own database (`usersrv`), the shared Redis (own key prefix),
  # no S3. It trusts only the BFF's public key and must NOT be published to the internet.
  # Mail credentials (config.usersrv.yaml: mail.<provider>) and the HMAC/encryption keys are
  # Secrets: mount them as files (key_file / hmac_key_file) or keep the whole config in a Secret.
  # Production: auto_migrate false and apply migrations/usersrv/ first (docs/deployment.md).
  usersrv:
    image: ghcr.io/kongken/mono-usersrv:main
    volumes:
      - ./config.usersrv.yaml:/config/config.yaml:ro
      - ./secrets/bff.pub:/secrets/bff.pub:ro
      # TLS only (not needed for h2c):
      # - ./secrets/usersrv.pem:/secrets/usersrv.pem:ro
      # - ./secrets/usersrv.key:/secrets/usersrv.key:ro
    environment:
      BUTTERFLY_CONFIG_TYPE: file
      BUTTERFLY_CONFIG_FILE_PATH: /config/config.yaml
      PORT: "18086"
    expose: ["18086", "18087"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # The internal network has no external connectivity. A separate bridge gives account
    # mail an outbound route (HTTPS or SMTP); no usersrv port is published to the host.
    networks: [internal, mail-egress]

  tripmap:
    image: ghcr.io/kongken/mono-tripmap:main
    volumes:
      - ./config.tripmap.yaml:/config/config.yaml:ro
      # Omit this mount when using internal_auth.trusted_keys[].public_key.
      - ./secrets/bff.pub:/secrets/bff.pub:ro
      # TLS only (not needed for h2c):
      # - ./secrets/tripmap.pem:/secrets/tripmap.pem:ro
      # - ./secrets/tripmap.key:/secrets/tripmap.key:ro
    environment:
      BUTTERFLY_CONFIG_TYPE: file
      BUTTERFLY_CONFIG_FILE_PATH: /config/config.yaml
      PORT: "18082"
    expose: ["18082", "18083"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  bff:
    image: ghcr.io/kongken/mono-bff:main
    volumes:
      - ./config.bff.yaml:/config/config.yaml:ro
      # Omit this mount when using internal_auth.private_key.
      - ./secrets/bff.key:/secrets/bff.key:ro
      # Only needed while at least one gRPC upstream uses TLS:
      # - ./secrets/ca.pem:/secrets/ca.pem:ro
    environment:
      BUTTERFLY_CONFIG_TYPE: file
      BUTTERFLY_CONFIG_FILE_PATH: /config/config.yaml
      PORT: "18081"
    expose: ["18081"]
    depends_on: [usersrv, tripmap, metro, postgres, redis]
    networks: [internal]

  # metro needs its own database (see config.metro.example.yaml) in the same
  # PostgreSQL server; like tripmap, it must NOT be published to the internet.
  metro:
    image: ghcr.io/kongken/mono-metro:main
    volumes:
      - ./config.metro.yaml:/config/config.yaml:ro
      - ./secrets/bff.pub:/secrets/bff.pub:ro
    environment:
      BUTTERFLY_CONFIG_TYPE: file
      BUTTERFLY_CONFIG_FILE_PATH: /config/config.yaml
      PORT: "18084"
    expose: ["18084", "18085"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # The published image is the standalone, local-only build. To connect it to the account center, rebuild it for
  # your own addresses (reserved examples here); the build fails without either one:
  #   docker build -f deploy/trip-map-web/Dockerfile \
  #     --build-arg VITE_API_BASE_URL=https://api.example.com/api \
  #     --build-arg VITE_OZID_ORIGIN=https://id.example.com .
  # Sign-in, registration, password and devices are OzID pages; the product calls the BFF at the canonical API origin
  # (an entry of the BFF's cors_allowed_origins and navigation.apps.trip-map), not a same-origin /api.
  trip-map-web:
    image: ghcr.io/kongken/mono-trip-map-web:main
    ports: ["443:443", "80:80"]
    environment:
      BACKEND_UPSTREAM: bff:18081
    depends_on: [bff]
    networks: [internal, edge]

  # Serve it on its own host name (an entry of the BFF's
  # cors_allowed_origins when the API is on another host) from the edge proxy, or publish a
  # port here. It proxies /api and /mcp/metro to the BFF.
  metro-web:
    image: ghcr.io/kongken/mono-metro-web:main
    environment:
      BACKEND_UPSTREAM: bff:18081
    depends_on: [bff]
    networks: [internal, edge]

  # OzID (the user center) is static and has no same-origin /api: its bundle calls the BFF at the
  # canonical public API origin, which is a build argument (no default) and also API_ORIGIN here
  # (the origin of that address, for the page's Content-Security-Policy; the container refuses to
  # start without it). Build it with
  #   docker build -f deploy/ozid-web/Dockerfile --build-arg VITE_API_BASE_URL=https://api.example.com/api .
  # Serve it on its own host (see deploy/reverse-proxy/Caddyfile.example). The BFF needs the
  # `navigation` registry and the OzID origin in cors_allowed_origins (config.bff.example.yaml).
  # Every address in this file is a reserved example name: use your own in a private copy.
  ozid-web:
    image: ghcr.io/kongken/mono-ozid-web:main   # replace with an image built for your API base
    environment:
      API_ORIGIN: https://api.example.com
    networks: [edge]

  # The unified management console (apps/admin; docs/admin/features.md) is static too and sits behind
  # a source allowlist: the container REFUSES TO START without ADMIN_ALLOWED_CIDRS (an empty or fully
  # open list is a refusal, never "open"), and every response of it (the page, the assets, the
  # single-page fallback) is limited to those networks. The BFF checks its own `admin.allowed_cidrs`
  # again on every user-management call, so the two lists belong together. Build it with
  #   docker build -f deploy/admin-web/Dockerfile \
  #     --build-arg VITE_API_BASE_URL=https://api.example.com/api \
  #     --build-arg VITE_OZID_ORIGIN=https://id.example.com .
  # ADMIN_TRUSTED_PROXIES is the edge proxy's network on `edge`: only then is the forwarded header
  # (which that proxy sets from the real peer) believed. Publish it only through that proxy, on its own
  # host (deploy/reverse-proxy/Caddyfile.example); never map its port to the internet. The proxy's
  # network must stay OUT of ADMIN_ALLOWED_CIDRS (overlap is refused at start).
  # Reserved example addresses: replace them in a private copy, and do not commit real ones.
  admin-web:
    image: ghcr.io/kongken/mono-admin-web:main   # replace with an image built for your API base and OzID origin
    environment:
      API_ORIGIN: https://api.example.com
      ADMIN_HOST: admin.example.com
      ADMIN_ALLOWED_CIDRS: 203.0.113.0/24
      ADMIN_TRUSTED_PROXIES: 172.16.0.0/12
    networks: [edge]

networks:
  internal:
    internal: true
  mail-egress:
  edge:

volumes:
  postgres-data:
  s3-data:
